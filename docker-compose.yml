version: '3.8'
services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    
  frontend:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000/api/upload-report
    depends_on:
      - api
    restart: unless-stopped
